# Futu option chain + statement DB
#
# OpenD (FutuOpenD) must run on the Windows desktop — NOT in Docker.
#
# Quick start:
#   1. Copy .env.example to .env and set MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD.
#   2. Start FutuOpenD and log in (port 11111, Connected).
#   3. docker compose up -d --build
#   4. Open http://localhost:8080          (option chain)
#          http://localhost:8080/transactions  (statement / P&L)
#
# Stop:
#   docker compose down

services:
  futu-db:
    image: mariadb:11.4
    container_name: futu-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-futu}
      MYSQL_USER: ${MYSQL_USER:-mickylee}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      # Host 3309 — 3306/3307/3308 often used by other local MySQL containers
      - "3309:3306"
    volumes:
      - futu_mariadb:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  futu-web:
    build: .
    image: futu-option-chain:latest
    container_name: futu-option-chain
    depends_on:
      futu-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      FUTU_OPEND_HOST: host.docker.internal
      FUTU_OPEND_PORT: "11111"
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8080"
      MYSQL_HOST: futu-db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-futu}
      MYSQL_USER: ${MYSQL_USER:-mickylee}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config:ro
      - ./uploads:/app/uploads
    restart: unless-stopped

  # One-off stock price CLI (optional):
  #   docker compose run --rm futu-cli 00700
  futu-cli:
    build: .
    image: futu-option-chain:latest
    profiles: ["cli"]
    environment:
      FUTU_OPEND_HOST: host.docker.internal
      FUTU_OPEND_PORT: "11111"
      MYSQL_HOST: futu-db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-futu}
      MYSQL_USER: ${MYSQL_USER:-mickylee}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config:ro
    entrypoint: ["python", "scripts/get_stock_price.py"]

volumes:
  futu_mariadb:
